[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vision-active-learning-loop"
version = "0.3.0"
description = "Reproducible active-learning infrastructure for computer vision"
requires-python = "==3.12.11"
dependencies = [
    "pycocotools==2.0.10",
    "pyyaml==6.0.2",
    "scipy==1.18.0",
    "torch==2.12.0+cu126",
    "torchvision==0.27.0+cu126",
    "transformers==5.15.0",
]

[project.scripts]
val = "vision_active_learning_loop.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
